name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SITE_BASE: /YichiYang.github.io
      - uses: actions/configure-pages@v5
      # Legacy branch publishing can otherwise overwrite this Astro artifact.
      - name: Wait for any legacy Pages publishing to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')" = "legacy" ]; then
            for attempt in $(seq 1 120); do
              state=$(curl --fail --silent --show-error "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=30" | jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // "not_started"')
              echo "Legacy Pages workflow: $state"
              if [ "$state" = "completed" ]; then
                exit 0
              fi
              sleep 5
            done
            echo "Legacy publishing did not finish before the timeout."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
